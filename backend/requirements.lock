# Resolved runtime dependencies, for reproducible image builds.
#
# requirements.txt states the ranges the project accepts; this states the
# exact versions an image is built from, so two builds a month apart install
# the same bytes. Regenerate deliberately, in its own change:
#
#     python -m venv /tmp/lock && /tmp/lock/bin/pip install -r backend/requirements.txt
#     /tmp/lock/bin/pip freeze --exclude-editable > backend/requirements.lock
#
# A test asserts every direct dependency in requirements.txt appears here.
