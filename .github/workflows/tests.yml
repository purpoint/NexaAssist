# The suites that need nothing but a checkout.
#
# Databases and Redis are a separate workflow, deliberately: this one should
# stay the fast answer to "did that change break anything", and a job that
# waits on service containers is not fast.
#
# It reads no secrets. Nothing here needs one -- the suite's own guard blocks
# outbound connections, so a test that tried to reach a real provider would
# fail rather than quietly bill someone.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The default token can write to the repository, and a workflow
# that never pushes anything has no use for that.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout action leaves the token in .git/config otherwise,
          # where anything the build runs could read it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # The version the container runs. Testing what ships is worth more
          # than testing the newest interpreter available.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: python -m pyflakes backend/app backend/alembic tests

      # The runner has a Docker daemon, so this includes the image smoke
      # tests: they build both images and inspect them. The database and
      # Redis tests skip here -- neither is reachable -- and the other
      # workflow is where they run.
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lock file and fails if the
      # lock and package.json have drifted, which is what a build wants.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend
