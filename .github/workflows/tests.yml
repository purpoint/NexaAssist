# The suites that need nothing but a checkout.
#
# Databases and Redis are a separate workflow, deliberately: this one should
# stay the fast answer to "did that change break anything", and a job that
# waits on service containers is not fast.
#
# It reads no secrets. Nothing here needs one -- the suite's own guard blocks
# outbound connections, so a test that tried to reach a real provider would
# fail rather than quietly bill someone.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The default token can write to the repository, and a workflow
# that never pushes anything has no use for that.
# A second push supersedes the first: the older run is answering a question
# nobody is still asking, and it is holding a runner to do it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Both legs run even when one fails: "3.11 broke" and "3.12 broke" are
      # different findings and waiting a round trip to learn the second is
      # waiting for nothing.
      fail-fast: false
      matrix:
        # The floor the project declares and the version the container runs.
        # Claiming 3.11 support while testing only 3.12 is a claim nothing
        # checks.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The checkout action leaves the token in .git/config otherwise,
          # where anything the build runs could read it.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: python -m pyflakes backend/app backend/alembic tests

      # The runner has a Docker daemon, so this includes the image smoke
      # tests: they build both images and inspect them. The database and
      # Redis tests skip here -- neither is reachable -- and the other
      # workflow is where they run.
      - name: Test
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # Before a push rather than after one, and it knows two things a
      # generic scanner does not: which file this project keeps its key in,
      # and that the file is meant to be untracked.
      - name: Scan for credentials
        run: ./scripts/scan-secrets.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lock file and fails if the
      # lock and package.json have drifted, which is what a build wants.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        run: npm run test
        working-directory: frontend
