# Serves the built client. Nothing is proxied through here: the browser talks
# to the API directly at the URL baked into the bundle, so this server has one
# job and no knowledge of the backend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so a long cache is safe for everything but the entry
    # point -- which must never be cached, or a deploy is invisible until
    # somebody clears their browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store";
        # Client-side routing: fall through to the app rather than 404.
        try_files $uri $uri/ /index.html;
    }
}
